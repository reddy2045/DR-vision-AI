<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PHC Tele-Ophthalmology{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f4f7fc; font-family: 'Inter', sans-serif; }
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .auth-card { width: min(100%, 520px); }
    </style>
</head>
<body>
    <main class="auth-shell">
        {% block content %}{% endblock %}
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
