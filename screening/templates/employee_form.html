{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width:760px;">
    <div class="d-flex align-items-center justify-content-between mb-4"><div><p class="text-uppercase small text-muted mb-1">PHC Administration</p><h1 class="h3 mb-0">{{ title }}</h1></div><a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">Back</a></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
            <div class="row g-3">
                {% for field in form %}<div class="col-md-{% if field.name == 'full_name' or field.name == 'employee_id' %}6{% else %}4{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
            </div>
            <button class="btn btn-primary mt-4" type="submit">Save Employee</button>
        </form>
    </div></div>
</div>
{% endblock %}
